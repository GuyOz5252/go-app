address: ':8080'
queries:
  user:
    get_by_id: 'SELECT id, username, email, password_hash FROM users WHERE id = $1'
    create: 'INSERT INTO users (username, email, password_hash) VALUES ($1, $2, $3) RETURNING id'
    update: 'UPDATE users SET username = $1, email = $2 WHERE id = $3'
    delete: 'DELETE FROM users WHERE id = $1 RETURNING id'
    exists_by_username: 'SELECT EXISTS(SELECT 1 FROM users WHERE username = $1)'
    exists_by_email: 'SELECT EXISTS(SELECT 1 FROM users WHERE email = $1)'
    get_by_email: 'SELECT id, username, email, password_hash FROM users WHERE email = $1'
  chat:
    get_by_id: 'SELECT id, name, image_url, created_at FROM chats WHERE id = $1'
    list_by_user_id: 'SELECT c.id, c.name, c.image_url FROM chats c JOIN chat_members cm ON c.id = cm.chat_id WHERE cm.user_id = $1'
    create: 'INSERT INTO chats (name, image_url, created_at) VALUES ($1, $2, $3) RETURNING id'
    add_member: 'INSERT INTO chat_members (chat_id, user_id, role) VALUES ($1, $2, $3)'
    remove_member: 'DELETE FROM chat_members WHERE chat_id = $1 AND user_id = $2'
    is_member_in_chat: 'SELECT EXISTS(SELECT 1 FROM chat_members WHERE chat_id = $1 AND user_id = $2)'
    create_message: 'INSERT INTO chat_messages (id, user_id, chat_id, content, media_url, reply_to_id, created_at) VALUES ($1, $2, $3, $4, $5, $6, $7) RETURNING id'
    get_messages: 'SELECT id, user_id, chat_id, content, media_url, reply_to_id, created_at FROM chat_messages WHERE chat_id = $1 ORDER BY created_at DESC LIMIT $2 OFFSET $3'
    get_members: 'SELECT user_id FROM chat_members WHERE chat_id = $1'
